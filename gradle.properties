org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Windows: allow building from a path that contains non-ASCII (e.g. Korean) folder names
android.overridePathCheck=true
kotlin.code.style=official

# Competition APK naming rule: apk/{TeamName}_{AppName}_release.apk
# gradle.properties is read as ISO-8859-1, so use an English team name (or \uXXXX escapes).
haegopa.teamName=TEAM

# Voice co-pilot: answer by voice (Pleos STT "응 / 아니"). Off in the contest beta:
# the Pleos emulator host has no microphone, so the beta answers with the notification/banner buttons only.
# Turn on after checking recognition with a real car mic (GitHub issue #10).
haegopa.copilotVoiceReply=false
