org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Windows: allow building from a path that contains non-ASCII (e.g. Korean) folder names
android.overridePathCheck=true
kotlin.code.style=official

# Competition APK naming rule: apk/{TeamName}_{AppName}_release.apk
# gradle.properties is read as ISO-8859-1, so use an English team name (or \uXXXX escapes).
haegopa.teamName=TEAM
